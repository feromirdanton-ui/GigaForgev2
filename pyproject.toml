[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaforge"
version = "6.0.0"
description = "Agentic orchestration harness for GigaChat with a standalone desktop control room"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "requests>=2.32",
    # Browser verification is a core Goal capability. Chromium is provisioned
    # automatically by the app when its browser binary is missing.
    "playwright>=1.45",
    # Goal runs existing project suites when present.
    "pytest>=8.0",
    # Goal, ReAct, chat, and sub-agents are implemented on LangGraph. This is a
    # required runtime dependency; the product must never silently use legacy loops.
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.21",
]

[project.optional-dependencies]
# Drag & drop of files and folders onto the window. Without it the app still runs:
# files can be attached with the 📎 button or by pasting a path.
desktop = ["tkinterdnd2>=0.4"]
# Declarative Qt Quick surface. It stays optional for the explicit Tk fallback;
# the Windows launcher and QML entry point install it automatically when missing.
qt-desktop = ["PySide6>=6.8,<7"]
# Tree-sitter grammars for languages beyond Python and JavaScript, whose
# parsers are included in the base harness installation.
languages = [
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
]
# Official GigaChat SDK transport (GigaChatSDKProvider). Optional: the legacy
# httpx client remains the default and needs no extra install.
#
# The SDK has no stable release yet — only pre-releases — so the pin is exact
# and the extra must be installed with ``--pre``:
#     pip install --pre "gigaforge[gigachat]"
# ``gigachat>=0.3`` resolves to nothing on PyPI and made this extra
# uninstallable.
gigachat = ["gigachat==0.3.0a1"]
# Everything the agent runtime needs is in the base install.
#
# ``deepagents`` and ``langchain-gigachat`` used to be listed here and were
# never imported anywhere in the package.  They are not needed:
#
# * the four middleware worth having (harness prompt, path normaliser,
#   deterministic-output guard, stale-output trimming) are ported into
#   ``gigaforge/agents`` and ``gigaforge/harness`` in ~500 lines with no
#   dependency;
# * ``langchain-gigachat`` is an adapter, and ``gigachat_sdk_adapter.py``
#   already talks to the official SDK directly;
# * ``deepagents`` pins ``langchain>=1.5``, which is dozens of transitive
#   dependencies and a second abstraction layer over the same HTTP call.
#
# An extra that installs nothing the code imports is a false statement in the
# package metadata, and it already cost one review round.
# Backward-compatible extra; Playwright is now included in the core install.
browser = []
# Local lint/build tooling. Pytest is a core runtime dependency because Goal mode
# executes an existing project's suite as part of verification.
dev = [
    "ruff>=0.4",
    "pillow>=10.0",
]

[project.scripts]
gigaforge = "gigaforge.cli:main"
gigaforge-desktop = "gigaforge.desktop:main"

[tool.setuptools.packages.find]
include = ["gigaforge*"]

[tool.setuptools.package-data]
gigaforge = ["assets/*.png", "assets/*.ico", "desktop/qml/*.qml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
