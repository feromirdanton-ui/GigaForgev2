[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaforge"
version = "6.0.0"
description = "Agentic orchestration harness for GigaChat with a standalone desktop control room"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "requests>=2.32",
    # Browser verification is a core Goal capability. Chromium is provisioned
    # automatically by the app when its browser binary is missing.
    "playwright>=1.45",
    # Goal runs existing project suites when present.
    "pytest>=8.0",
]

[project.optional-dependencies]
# Drag & drop of files and folders onto the window. Without it the app still runs:
# files can be attached with the 📎 button or by pasting a path.
desktop = ["tkinterdnd2>=0.4"]
# Declarative Qt Quick surface. It stays optional for the explicit Tk fallback;
# the Windows launcher and QML entry point install it automatically when missing.
qt-desktop = ["PySide6>=6.8,<7"]
# Tree-sitter grammars for languages beyond Python and JavaScript, whose
# parsers are included in the base harness installation.
languages = [
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
]
# Backward-compatible extra; Playwright is now included in the core install.
browser = []
# Local lint/build tooling. Pytest is a core runtime dependency because Goal mode
# executes an existing project's suite as part of verification.
dev = ["ruff>=0.4", "pillow>=10.0"]

[project.scripts]
gigaforge = "gigaforge.cli:main"
gigaforge-desktop = "gigaforge.desktop:main"

[tool.setuptools.packages.find]
include = ["gigaforge*"]

[tool.setuptools.package-data]
gigaforge = ["assets/*.png", "assets/*.ico", "desktop/qml/*.qml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
