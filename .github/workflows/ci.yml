name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: Install Chromium for the render tests
        # ``pip install playwright`` installs the client, not the browser.  The
        # render tests (panel design, WCAG gate, glitch probe) need a real
        # Chromium, and without this step they failed on "Executable doesn't
        # exist" -- the guard checked the package, which was present, so it did
        # not skip.  Installing the browser is the fix; the guard now also
        # launches it, so a future regression skips instead of failing.
        run: python -m playwright install --with-deps chromium
      - name: Unit tests
        run: python -m pytest -q
      - name: Bench must be all-green
        run: |
          python - <<'PY'
          import json, sys
          rows = json.load(open("bench.json"))
          failed = [r for r in rows if not r.get("success")]
          for r in rows:
              print(f"{r['name']:<28} {'PASS' if r['success'] else 'FAIL'}  "
                    f"{r['tokens_total']:>6} tok  {r.get('error','')[:80]}")
          if failed:
              print(f"\n{len(failed)} bench task(s) failed", file=sys.stderr)
              sys.exit(1)
          print(f"\nall {len(rows)} bench tasks passed")
          PY
      - name: Panel design audit (all four views, three widths)
        # ``gigaforge wcag`` measures the Overview tab only: the other three are
        # ``display:none`` until opened, so a single run silently skips them.
        # This opens each view at 1440/375/320 and fails on any pair below AA.
        run: python scripts/ui_design_audit.py --label ci --json ui-audit.json
      - name: Panel interactive states
        # Contrast is a colour probe; this checks what a colour probe cannot
        # see -- real tablist semantics, arrow-key movement, a painted focus
        # ring, aria-busy while refreshing, and no console error.
        run: python scripts/ui_state_check.py /tmp/panel-ci.html
      - name: Upload UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ matrix.python-version }}
          path: |
            ui-audit.json
            /tmp/panel-ci.html
          if-no-files-found: ignore
